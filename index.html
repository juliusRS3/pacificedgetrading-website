<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F55D6">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%231F55D6%22/%3E%3Cpath%20d%3D%22M11%2024V8h6.5a5%205%200%200%201%200%2010H11M19%2024h3.5%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pacific Edge Trading</title>
<meta name="description" content="Pacific Edge Trading Sdn Bhd builds progressive web apps (PWAs) for businesses in Malaysia, from attendance apps to procurement, accounting and asset management systems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: one calm column that explains a single service, with a phone mock as the only picture */
:root{
  --bg:#FFFFFF; --soft:#F1F4FA; --ink:#14203A; --muted:#55627A; --line:#DFE4EE;
  --accent:#1F55D6; --accent-soft:#E4ECFD; --ok:#1C8A5A;
  --display:"Outfit", "Segoe UI", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --soft:#151D31; --ink:#E6EBF5; --muted:#A1ACC2; --line:#26304A;
  --accent:#7FA4FF; --accent-soft:#1B2A4F; --ok:#5ACB95; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --soft:#151D31; --ink:#E6EBF5; --muted:#A1ACC2; --line:#26304A;
  --accent:#7FA4FF; --accent-soft:#1B2A4F; --ok:#5ACB95; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font:400 1.02rem/1.65 var(--body)}
.wrap{max-width:1040px;margin-inline:auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance}
h2{font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:700}
h3{font-size:1.12rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.label{font:700 .74rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);font-size:1.1rem;max-width:60ch}
section{padding-block:clamp(56px,8vw,96px)}
.head{display:grid;gap:12px;margin-bottom:36px;max-width:680px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:62px}
.brand{font:700 1.08rem/1 var(--display);color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.dot{width:30px;height:30px;flex:none}
.navlinks{display:flex;gap:22px;align-items:center}
.navlinks a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}
.navlinks a:hover{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 .96rem/1 var(--body);padding:14px 22px;border-radius:999px;text-decoration:none;border:0;cursor:pointer}
.btn-main{background:var(--accent);color:var(--bg)}
.navlinks .btn{color:var(--bg);padding:10px 16px}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
@media (max-width:640px){.navlinks a:not(.btn){display:none}}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(2.3rem,5.6vw,3.9rem);font-weight:700;margin:16px 0 20px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.phone{justify-self:center;width:min(270px,100%);aspect-ratio:9/18;max-width:100%;border-radius:36px;border:10px solid var(--ink);background:var(--soft);padding:18px 14px;display:flex;flex-direction:column;gap:10px}
.notch{width:70px;height:6px;border-radius:6px;background:var(--line);margin:0 auto 6px}
.appbar{display:flex;align-items:center;gap:8px;font:600 .82rem var(--display)}
.appbar .ic{width:28px;height:28px;flex:none}
.tile{background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:4px;border:1px solid var(--line)}
.tile b{font:600 .85rem var(--display)}
.tile span{font-size:.74rem;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line)}
.bar i{display:block;height:100%;width:62%;border-radius:6px;background:var(--accent)}
.prompt{margin-top:auto;background:var(--accent);color:var(--bg);border-radius:12px;padding:11px;font:600 .78rem var(--body);text-align:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}.phone{width:min(230px,100%)}}

/* what is a pwa */
.soft{background:var(--soft)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:14px;align-content:start;min-width:0}
.col.pwa{box-shadow:inset 0 0 0 2px var(--accent)}
.col ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.col li{display:flex;gap:10px;align-items:flex-start;font-size:.97rem}
.col li svg{flex:none;margin-top:4px}
.col .tagline{font-size:.86rem;color:var(--muted)}
@media (max-width:700px){.compare{grid-template-columns:1fr}}

/* examples */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:8px;align-content:start;min-width:0}
.card p{color:var(--muted);font-size:.95rem}
.card .eg{font-size:.82rem;color:var(--accent);font-weight:700}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.grid{grid-template-columns:1fr}}

/* icons */
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;overflow:visible}
.ichip{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.apps .ichip{margin-bottom:6px;background:var(--bg)}
.apps > li.custom .ichip{background:var(--accent);color:var(--bg)}
.btn .i{width:18px;height:18px;margin-left:8px}
.step-top{display:flex;justify-content:space-between;align-items:center}
.sico{width:26px;height:26px;color:var(--accent)}
.tile b{display:flex;align-items:center;gap:6px}
.tile .i{width:15px;height:15px;color:var(--accent)}
.prompt{display:flex;align-items:center;justify-content:center;gap:6px}
.prompt .i{width:16px;height:16px}
.mail .i{color:var(--bg);width:22px;height:22px}

/* range of apps */
.tier{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2fr);gap:32px;padding-block:32px;border-top:1px solid var(--line)}
.tier-head{display:grid;gap:10px;align-content:start}
.tier-head p{color:var(--muted);font-size:.95rem}
.scale{display:flex;gap:4px}
.scale i{width:22px;height:6px;border-radius:4px;background:var(--accent)}
.scale i.off{background:var(--line)}
.apps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.apps > li{background:var(--soft);border-radius:12px;padding:16px;display:grid;gap:4px;align-content:start;min-width:0}
.apps > li.wide{grid-column:1/-1}
.apps > li.custom{background:var(--bg);border:1.5px dashed var(--accent)}
.apps > li.custom b{color:var(--accent)}
.apps b{font:600 1rem var(--display)}
.apps span{color:var(--muted);font-size:.92rem}
.flow{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 6px;counter-reset:f}
.flow li{counter-increment:f;display:flex;align-items:center;gap:6px;font-size:.86rem;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.flow li::before{content:counter(f);display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.75rem}
.more{margin-top:28px;padding:18px 20px;border-radius:12px;background:var(--accent-soft);font-size:.98rem}
@media (max-width:820px){.tier{grid-template-columns:1fr;gap:18px}}
@media (max-width:540px){.apps{grid-template-columns:1fr}}

/* example project */
#example{border-top:1px solid var(--line)}
.ex{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:56px;align-items:center;padding-block:36px}
.ex + .ex{border-top:1px solid var(--line)}
.ex-rev{grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr)}
.ex-rev .ex-phone{order:-1}
.ex-tag{justify-self:start;font:700 .72rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:6px}
.ex-h{font-size:clamp(1.4rem,2.8vw,1.85rem);font-weight:700}
.ex-text{display:grid;gap:18px;min-width:0}
.ex-flow{margin:4px 0 0}
.ex-points{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ex-points li{display:flex;gap:12px;align-items:flex-start;color:var(--muted);font-size:.97rem}
.ex-points b{color:var(--ink);font-weight:700}
.ex-points .i{color:var(--accent);margin-top:2px}
.ex-cta{font-weight:600}
.ex-phone{justify-self:center;width:min(300px,100%);max-width:100%;border-radius:36px;border:10px solid var(--ink);background:#FBFBFB;padding:14px 0 22px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden}
.ex-phone .notch{background:#D9D9D9}
.ex-shot{display:block;width:100%;height:auto}
@media (max-width:820px){.ex,.ex-rev{grid-template-columns:1fr;gap:36px}.ex-rev .ex-phone{order:0}}

/* included */
.incl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.incl > div{display:flex;gap:14px;padding:18px 4px;border-bottom:1px solid var(--line)}
.incl > div:nth-child(odd){padding-right:24px}

.incl p{color:var(--muted);font-size:.94rem}
@media (max-width:700px){.incl{grid-template-columns:1fr}.incl > div:nth-child(odd){padding-right:4px}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.step{background:var(--bg);border-radius:var(--r);padding:22px;display:grid;gap:8px;align-content:start;border:1px solid var(--line)}
.step .n{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 .9rem var(--display)}
.step p{color:var(--muted);font-size:.94rem}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* enquiry form */
.qform{display:grid;gap:18px}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);margin:0;padding:clamp(18px,3.5vw,28px);min-width:0}
legend{font:600 1.15rem var(--display);display:flex;align-items:center;gap:10px;padding:0 6px;margin-left:-6px}
.fn{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-size:.85rem}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:8px}
.fields.one{grid-template-columns:1fr}
.full{grid-column:1/-1}
.qform label{display:grid;gap:6px;font-size:.9rem;font-weight:600}
.qform input:not([type=checkbox]):not([type=radio]),.qform select,.qform textarea{font:400 .98rem var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.qform textarea{min-height:100px;resize:vertical}
.qform input:focus,.qform select:focus,.qform textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.qform .invalid{border-color:#C8412F!important}
.glabel{font-size:.9rem;font-weight:600;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.qform label.opt{display:flex;align-items:center;gap:8px;font-weight:400;font-size:.92rem;background:var(--soft);border:1.5px solid transparent;border-radius:10px;padding:9px 12px;cursor:pointer}
.qform label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input,.consent input{accent-color:var(--accent);width:17px;height:17px;flex:none;margin:0}
.qform label.consent{display:flex;align-items:flex-start;gap:10px;font-weight:400}
.qform label.other-box{background:var(--accent-soft);border-radius:10px;padding:14px}
.qform label.other-box[hidden]{display:none}
.submit-row{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.err{color:#C8412F;font-weight:600;font-size:.92rem}
.result{background:var(--bg);border:2px solid var(--accent);border-radius:var(--r);padding:clamp(20px,4vw,32px);display:grid;gap:14px}
.result pre{margin:0;background:var(--soft);border-radius:10px;padding:16px;font:400 .86rem/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}
@media (max-width:760px){.fields{grid-template-columns:1fr}.opts.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.opts.grid3,.opts.grid2{grid-template-columns:1fr}}

/* contact */
.contact{background:var(--ink);color:var(--bg);border-radius:22px;padding:clamp(28px,5vw,52px);display:grid;gap:18px;justify-items:start}
.contact h2{color:var(--bg)}
.contact p{color:color-mix(in srgb,var(--bg) 78%,var(--ink));max-width:56ch}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 10%,var(--ink));border-radius:12px;padding:10px 10px 10px 16px;max-width:100%}
.mail code{font:700 1.05rem var(--body);color:var(--bg);user-select:all;overflow-wrap:anywhere}
.mail button{font:700 .85rem var(--body);background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}

footer{padding-block:28px;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
</style>
</head>
